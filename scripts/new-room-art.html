<!DOCTYPE html>
<html>
<head>
<style>
  /* Keep the page unpainted: element screenshots with omitBackground only
     stay transparent if no CSS background renders behind them. */
  body { margin: 20px; }
  .row { margin: 14px 0; }
  svg { vertical-align: bottom; }
</style>
</head>
<body>

<!-- Bedroom door: warm wood, twin inset panels, gold knob (right side; code flips) -->
<div class="row">
<svg data-out="door" width="76" height="150" viewBox="0 0 76 150">
  <rect x="3" y="3" width="70" height="144" rx="7" fill="#c7803e" stroke="#49270b" stroke-width="3.5"/>
  <rect x="13" y="14" width="50" height="54" rx="5" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <rect x="13" y="80" width="50" height="54" rx="5" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <circle cx="63" cy="74" r="5" fill="#f2d16b" stroke="#49270b" stroke-width="2.5"/>
</svg>
</div>

<!-- Bed: wood head/foot posts, cream mattress, periwinkle blanket with folds -->
<div class="row">
<svg data-out="bed" width="280" height="64" viewBox="0 0 280 64">
  <!-- headboard -->
  <rect x="3" y="3" width="26" height="58" rx="8" fill="#c7803e" stroke="#49270b" stroke-width="3"/>
  <!-- foot post -->
  <rect x="253" y="20" width="24" height="41" rx="6" fill="#c7803e" stroke="#49270b" stroke-width="3"/>
  <!-- legs -->
  <rect x="34" y="48" width="14" height="13" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2.5"/>
  <rect x="232" y="48" width="14" height="13" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2.5"/>
  <!-- mattress -->
  <rect x="24" y="20" width="236" height="32" rx="9" fill="#f2ede4" stroke="#49270b" stroke-width="3"/>
  <!-- blanket tucked over the right side -->
  <path d="M84 20 h168 q9 0 9 9 v14 q0 9 -9 9 H84 q-6 -8 0 -16 t0 -16 z"
        fill="#8f9bd4" stroke="#49270b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 22 q-5 14 0 28 M160 22 q-5 14 0 28 M200 22 q-5 14 0 28"
        fill="none" stroke="#6f7dbd" stroke-width="2.5" stroke-linecap="round"/>
</svg>
</div>

<!-- Pillow -->
<div class="row">
<svg data-out="pillow" width="90" height="26" viewBox="0 0 90 26">
  <rect x="2.5" y="2.5" width="85" height="21" rx="10" fill="#f6f1e8" stroke="#49270b" stroke-width="3"/>
  <path d="M14 13 q8 -5 16 0 M60 13 q8 -5 16 0" fill="none" stroke="#d9cfbf" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>

<!-- Dresser: little sibling of the living-room cabinet -->
<div class="row">
<svg data-out="dresser" width="120" height="70" viewBox="0 0 120 70">
  <!-- top lip -->
  <rect x="2" y="2" width="116" height="10" rx="4" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <!-- body -->
  <rect x="6" y="10" width="108" height="50" rx="5" fill="#c7803e" stroke="#49270b" stroke-width="3"/>
  <!-- drawer fronts -->
  <rect x="15" y="17" width="90" height="17" rx="4" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <rect x="15" y="38" width="90" height="17" rx="4" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <circle cx="60" cy="25.5" r="3.5" fill="#6b4423" stroke="#49270b" stroke-width="1.5"/>
  <circle cx="60" cy="46.5" r="3.5" fill="#6b4423" stroke="#49270b" stroke-width="1.5"/>
  <!-- legs -->
  <rect x="14" y="59" width="12" height="9" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2"/>
  <rect x="94" y="59" width="12" height="9" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2"/>
</svg>
</div>

<!-- High shelf plank -->
<div class="row">
<svg data-out="shelf" width="180" height="16" viewBox="0 0 180 16">
  <rect x="2" y="2.5" width="176" height="11" rx="5" fill="#c7803e" stroke="#49270b" stroke-width="2.5"/>
  <rect x="6" y="5" width="168" height="3" rx="1.5" fill="#dc9d4f"/>
</svg>
</div>

<!-- Rug -->
<div class="row">
<svg data-out="rug" width="340" height="14" viewBox="0 0 340 14">
  <rect x="2" y="2" width="336" height="10" rx="5" fill="#a5796a" stroke="#49270b" stroke-width="2.5"/>
  <rect x="26" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
  <rect x="44" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
  <rect x="287" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
  <rect x="305" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
</svg>
</div>

<!-- Night window: same frame family as the living-room window, moon inside -->
<div class="row">
<svg data-out="moon-window" width="110" height="140" viewBox="0 0 110 140">
  <rect x="3" y="3" width="104" height="134" rx="9" fill="#dc9d4f" stroke="#49270b" stroke-width="3.5"/>
  <rect x="15" y="15" width="80" height="110" rx="5" fill="#322b44" stroke="#49270b" stroke-width="2.5"/>
  <circle cx="33" cy="42" r="14" fill="#f4eecb"/>
  <circle cx="28" cy="38" r="3" fill="#e3dcae"/>
  <circle cx="38" cy="47" r="2.2" fill="#e3dcae"/>
  <path d="M76 40 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 z" fill="#f4eecb"/>
  <path d="M30 94 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 z" fill="#f4eecb"/>
  <path d="M72 102 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5 z" fill="#f4eecb"/>
  <!-- mullion cross over the glass, like the living-room window -->
  <rect x="51" y="15" width="8" height="110" fill="#dc9d4f" stroke="#49270b" stroke-width="2"/>
  <rect x="15" y="66" width="80" height="8" fill="#dc9d4f" stroke="#49270b" stroke-width="2"/>
</svg>
</div>

<!-- Stormy (stormy-sad.png / stormy-happy.png) is NOT generated from here.
     Her sprites are made externally in an image generator and fitted to the
     108x118 game canvas (background removed, scaled, and aligned on the
     sitting baseline). So there's no data-out="stormy-*" here on purpose --
     re-running this file must not overwrite that hand-made art. -->

<!-- Pusheencorn (pusheencorn.png) is NOT generated from here either. Like
     Stormy, the costume sprite is made in an image generator and fitted to the
     game: background removed, the gray body scaled to Pusheen's size and
     anchored by the feet (centered so it swaps in over the base sprite). So
     there's deliberately no data-out="pusheencorn" here -- re-running this
     file must not overwrite that art. -->

<!-- Yarn ball -->
<div class="row">
<svg data-out="yarn-ball" width="28" height="28" viewBox="0 0 28 28">
  <circle cx="14" cy="14" r="11.5" fill="#e57390" stroke="#49270b" stroke-width="2.4"/>
  <path d="M4.5 10 q9 -5 19 0 M4.5 18 q9 5 19 0 M10 3.5 q-5 10 0 21"
        fill="none" stroke="#c44f70" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>

<!-- Pusheencorn costume box: open flaps, horn emblem, rainbow stripes -->
<div class="row">
<svg data-out="costume-box" width="120" height="102" viewBox="0 0 120 102">
  <!-- open flaps behind the rim -->
  <path d="M8 16 l-6 -11 26 3 -4 8 z" fill="#a87848" stroke="#49270b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M112 16 l6 -11 -26 3 4 8 z" fill="#a87848" stroke="#49270b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- body -->
  <rect x="4" y="13" width="112" height="85" rx="6" fill="#c79a66" stroke="#49270b" stroke-width="3"/>
  <!-- rim shading -->
  <rect x="8" y="16" width="104" height="9" rx="4" fill="#a87848"/>
  <!-- horn emblem -->
  <path d="M60 34 l-8 24 q8 4 16 0 z" fill="#ffd166" stroke="#49270b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M57 46 l7 -3 M54 54 l9 -4" fill="none" stroke="#d9a83f" stroke-width="2" stroke-linecap="round"/>
  <!-- rainbow stripes -->
  <rect x="18" y="68" width="84" height="8" rx="4" fill="#f48fb1" stroke="#49270b" stroke-width="2"/>
  <rect x="18" y="81" width="84" height="8" rx="4" fill="#81d4fa" stroke="#49270b" stroke-width="2"/>
</svg>
</div>

</body>
</html>
