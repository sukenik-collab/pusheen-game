<!DOCTYPE html>
<html>
<head>
<style>
  /* Keep the page unpainted: element screenshots with omitBackground only
     stay transparent if no CSS background renders behind them. */
  body { margin: 20px; }
  .row { margin: 14px 0; }
  svg { vertical-align: bottom; }
</style>
</head>
<body>

<!-- Bedroom door: warm wood, twin inset panels, gold knob (right side; code flips) -->
<div class="row">
<svg data-out="door" width="76" height="150" viewBox="0 0 76 150">
  <rect x="3" y="3" width="70" height="144" rx="7" fill="#c7803e" stroke="#49270b" stroke-width="3.5"/>
  <rect x="13" y="14" width="50" height="54" rx="5" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <rect x="13" y="80" width="50" height="54" rx="5" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <circle cx="63" cy="74" r="5" fill="#f2d16b" stroke="#49270b" stroke-width="2.5"/>
</svg>
</div>

<!-- Bed: wood head/foot posts, cream mattress, periwinkle blanket with folds -->
<div class="row">
<svg data-out="bed" width="280" height="64" viewBox="0 0 280 64">
  <!-- headboard -->
  <rect x="3" y="3" width="26" height="58" rx="8" fill="#c7803e" stroke="#49270b" stroke-width="3"/>
  <!-- foot post -->
  <rect x="253" y="20" width="24" height="41" rx="6" fill="#c7803e" stroke="#49270b" stroke-width="3"/>
  <!-- legs -->
  <rect x="34" y="48" width="14" height="13" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2.5"/>
  <rect x="232" y="48" width="14" height="13" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2.5"/>
  <!-- mattress -->
  <rect x="24" y="20" width="236" height="32" rx="9" fill="#f2ede4" stroke="#49270b" stroke-width="3"/>
  <!-- blanket tucked over the right side -->
  <path d="M84 20 h168 q9 0 9 9 v14 q0 9 -9 9 H84 q-6 -8 0 -16 t0 -16 z"
        fill="#8f9bd4" stroke="#49270b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 22 q-5 14 0 28 M160 22 q-5 14 0 28 M200 22 q-5 14 0 28"
        fill="none" stroke="#6f7dbd" stroke-width="2.5" stroke-linecap="round"/>
</svg>
</div>

<!-- Pillow -->
<div class="row">
<svg data-out="pillow" width="90" height="26" viewBox="0 0 90 26">
  <rect x="2.5" y="2.5" width="85" height="21" rx="10" fill="#f6f1e8" stroke="#49270b" stroke-width="3"/>
  <path d="M14 13 q8 -5 16 0 M60 13 q8 -5 16 0" fill="none" stroke="#d9cfbf" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>

<!-- Dresser: little sibling of the living-room cabinet -->
<div class="row">
<svg data-out="dresser" width="120" height="70" viewBox="0 0 120 70">
  <!-- top lip -->
  <rect x="2" y="2" width="116" height="10" rx="4" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <!-- body -->
  <rect x="6" y="10" width="108" height="50" rx="5" fill="#c7803e" stroke="#49270b" stroke-width="3"/>
  <!-- drawer fronts -->
  <rect x="15" y="17" width="90" height="17" rx="4" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <rect x="15" y="38" width="90" height="17" rx="4" fill="#dc9d4f" stroke="#49270b" stroke-width="2.5"/>
  <circle cx="60" cy="25.5" r="3.5" fill="#6b4423" stroke="#49270b" stroke-width="1.5"/>
  <circle cx="60" cy="46.5" r="3.5" fill="#6b4423" stroke="#49270b" stroke-width="1.5"/>
  <!-- legs -->
  <rect x="14" y="59" width="12" height="9" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2"/>
  <rect x="94" y="59" width="12" height="9" rx="3" fill="#b27b3b" stroke="#49270b" stroke-width="2"/>
</svg>
</div>

<!-- High shelf plank -->
<div class="row">
<svg data-out="shelf" width="180" height="16" viewBox="0 0 180 16">
  <rect x="2" y="2.5" width="176" height="11" rx="5" fill="#c7803e" stroke="#49270b" stroke-width="2.5"/>
  <rect x="6" y="5" width="168" height="3" rx="1.5" fill="#dc9d4f"/>
</svg>
</div>

<!-- Rug -->
<div class="row">
<svg data-out="rug" width="340" height="14" viewBox="0 0 340 14">
  <rect x="2" y="2" width="336" height="10" rx="5" fill="#a5796a" stroke="#49270b" stroke-width="2.5"/>
  <rect x="26" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
  <rect x="44" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
  <rect x="287" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
  <rect x="305" y="4" width="9" height="6" rx="3" fill="#e8dcc8"/>
</svg>
</div>

<!-- Night window: same frame family as the living-room window, moon inside -->
<div class="row">
<svg data-out="moon-window" width="110" height="140" viewBox="0 0 110 140">
  <rect x="3" y="3" width="104" height="134" rx="9" fill="#dc9d4f" stroke="#49270b" stroke-width="3.5"/>
  <rect x="15" y="15" width="80" height="110" rx="5" fill="#322b44" stroke="#49270b" stroke-width="2.5"/>
  <circle cx="33" cy="42" r="14" fill="#f4eecb"/>
  <circle cx="28" cy="38" r="3" fill="#e3dcae"/>
  <circle cx="38" cy="47" r="2.2" fill="#e3dcae"/>
  <path d="M76 40 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 z" fill="#f4eecb"/>
  <path d="M30 94 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 z" fill="#f4eecb"/>
  <path d="M72 102 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5 z" fill="#f4eecb"/>
  <!-- mullion cross over the glass, like the living-room window -->
  <rect x="51" y="15" width="8" height="110" fill="#dc9d4f" stroke="#49270b" stroke-width="2"/>
  <rect x="15" y="66" width="80" height="8" fill="#dc9d4f" stroke="#49270b" stroke-width="2"/>
</svg>
</div>

<!-- Stormy: Pusheen's little sister -- a fluffy Persian sitting up, ~2/3
     Pusheen's size so her body reads about Pusheen's walking-sprite height,
     with a big fluffy tail below that crosses the floor line for depth. Two
     faces: sad (lost her yarn) until the quest is done, then happy. The body
     + tail markup is identical between them; only the face group differs. -->
<div class="row">
<svg data-out="stormy-sad" width="108" height="118" viewBox="0 0 108 118">
  <!-- tail: fluffy cloud tucked under the body, crossing the floor line -->
  <g transform="translate(-5,-3)">
    <path d="M58 76 C 71 70 86 74 88 85 C 98 87 98 100 89 104 C 91 113 79 117 71 110 C 64 116 54 111 57 100 C 49 98 51 88 61 89 Z"
          fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
    <path d="M74 82 q3 6 1 11 M82 85 q2 5 0 9" fill="none" stroke="#b9b0a7" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- ears -->
  <path d="M28 32 L23 8 L45 26 Z" fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 26 L66 8 L82 34 Z" fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <!-- fluffy sitting body -->
  <path d="M40 22 C 27 19 20 33 21 44 C 11 47 12 62 21 65 C 12 71 17 87 30 84 C 32 95 47 95 49 86 C 55 96 69 92 66 81 C 78 85 87 73 78 65 C 89 61 88 47 76 46 C 79 34 71 19 57 23 C 53 17 44 17 40 22 Z"
        fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <path d="M36 22 q1 5 0 9 M44 21 q1 5 0 10 M52 23 q1 5 0 8" fill="none" stroke="#b9b0a7" stroke-width="3" stroke-linecap="round"/>
  <path d="M41 87 v5 M49 87 v5" fill="none" stroke="#442001" stroke-width="2" stroke-linecap="round"/>
  <!-- sad face: worried brows + tears -->
  <path d="M31 39 q4 -4 9 -2 M53 37 q5 -2 9 2" fill="none" stroke="#3a2d22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="35" cy="44" r="3" fill="#3a2d22"/><circle cx="53" cy="44" r="3" fill="#3a2d22"/>
  <path d="M34 48 q-3 5 0 7 q3 -2 0 -7 Z" fill="#8fd3e0" stroke="#5aa9bb" stroke-width="0.7"/>
  <path d="M52 48 q-3 5 0 7 q3 -2 0 -7 Z" fill="#8fd3e0" stroke="#5aa9bb" stroke-width="0.7"/>
  <path d="M40 56 q4 -4 8 0" fill="none" stroke="#3a2d22" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="27" cy="51" rx="4" ry="2.3" fill="#f2b8c2" opacity="0.85"/>
  <ellipse cx="61" cy="51" rx="4" ry="2.3" fill="#f2b8c2" opacity="0.85"/>
</svg>
</div>

<div class="row">
<svg data-out="stormy-happy" width="108" height="118" viewBox="0 0 108 118">
  <g transform="translate(-5,-3)">
    <path d="M58 76 C 71 70 86 74 88 85 C 98 87 98 100 89 104 C 91 113 79 117 71 110 C 64 116 54 111 57 100 C 49 98 51 88 61 89 Z"
          fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
    <path d="M74 82 q3 6 1 11 M82 85 q2 5 0 9" fill="none" stroke="#b9b0a7" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <path d="M28 32 L23 8 L45 26 Z" fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 26 L66 8 L82 34 Z" fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <path d="M40 22 C 27 19 20 33 21 44 C 11 47 12 62 21 65 C 12 71 17 87 30 84 C 32 95 47 95 49 86 C 55 96 69 92 66 81 C 78 85 87 73 78 65 C 89 61 88 47 76 46 C 79 34 71 19 57 23 C 53 17 44 17 40 22 Z"
        fill="#d8d2ce" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <path d="M36 22 q1 5 0 9 M44 21 q1 5 0 10 M52 23 q1 5 0 8" fill="none" stroke="#b9b0a7" stroke-width="3" stroke-linecap="round"/>
  <path d="M41 87 v5 M49 87 v5" fill="none" stroke="#442001" stroke-width="2" stroke-linecap="round"/>
  <!-- happy face: dot eyes + nose + smile -->
  <circle cx="35" cy="43" r="3" fill="#3a2d22"/><circle cx="53" cy="43" r="3" fill="#3a2d22"/>
  <path d="M42.5 47 h4 l-2 2 z" fill="#d98a9a"/>
  <path d="M39 50 q3 4 5 1 q2 3 5 -1" fill="none" stroke="#3a2d22" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="27" cy="50" rx="4.2" ry="2.4" fill="#f2b8c2" opacity="0.9"/>
  <ellipse cx="61" cy="50" rx="4.2" ry="2.4" fill="#f2b8c2" opacity="0.9"/>
</svg>
</div>

<!-- Pusheencorn: the costumed Pusheen. Same gray loaf + face as the base
     sprite (so it swaps in seamlessly, body centered on the canvas), plus a
     unicorn horn, a rainbow mane cresting the back, and a flowing rainbow
     tail. Faces left, like the base sprite; the game flips it to walk right. -->
<div class="row">
<svg data-out="pusheencorn" width="138" height="116" viewBox="0 0 138 116">
  <!-- flowing rainbow tail, right side -->
  <path d="M112 50 C 132 52 136 76 120 94 C 111 102 98 97 103 86 C 116 80 119 64 107 58 Z"
        fill="#f6a5c0" stroke="#442001" stroke-width="3" stroke-linejoin="round"/>
  <path d="M113 55 C 126 60 126 79 116 89" fill="none" stroke="#a8e6cf" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M115 59 C 124 65 123 79 117 85" fill="none" stroke="#c9b6e8" stroke-width="3" stroke-linecap="round"/>
  <!-- plump loaf body, centered on the canvas -->
  <rect x="22" y="26" width="94" height="64" rx="30" fill="#b5a89c" stroke="#442001" stroke-width="3"/>
  <!-- ears flanking the horn -->
  <path d="M28 30 L26 17 L39 28 Z" fill="#b5a89c" stroke="#442001" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M45 28 L50 17 L57 29 Z" fill="#b5a89c" stroke="#442001" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- rainbow mane cresting the upper back -->
  <path d="M50 43 C 46 30 52 18 61 20 C 59 30 59 38 62 43 Z" fill="#f6a5c0" stroke="#442001" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 43 C 56 31 63 21 71 23 C 69 32 68 38 70 43 Z" fill="#ffd97a" stroke="#442001" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M69 44 C 65 33 72 25 80 27 C 78 34 77 40 79 44 Z" fill="#8fd0f2" stroke="#442001" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- unicorn horn -->
  <path d="M33 27 L43 27 L38.5 3 Z" fill="#ffd97a" stroke="#442001" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M34.5 22 l7 -1.4 M35.5 16.5 l6 -1.3 M36.5 11 l4.5 -1" fill="none" stroke="#d9a83f" stroke-width="1.7" stroke-linecap="round"/>
  <!-- face (left), whiskers, feet -->
  <circle cx="42" cy="56" r="3.2" fill="#442001"/><circle cx="60" cy="56" r="3.2" fill="#442001"/>
  <path d="M47 60 q4 4 7 1 q3 3 6 -1" fill="none" stroke="#442001" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="53.5" cy="61.5" r="1.7" fill="#e88ba0"/>
  <path d="M14 55 l18 1 M14 61 l18 -1" fill="none" stroke="#442001" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M44 90 v4 M62 90 v4 M86 90 v4" fill="none" stroke="#442001" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>

<!-- Yarn ball -->
<div class="row">
<svg data-out="yarn-ball" width="28" height="28" viewBox="0 0 28 28">
  <circle cx="14" cy="14" r="11.5" fill="#e57390" stroke="#49270b" stroke-width="2.4"/>
  <path d="M4.5 10 q9 -5 19 0 M4.5 18 q9 5 19 0 M10 3.5 q-5 10 0 21"
        fill="none" stroke="#c44f70" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>

<!-- Pusheencorn costume box: open flaps, horn emblem, rainbow stripes -->
<div class="row">
<svg data-out="costume-box" width="120" height="102" viewBox="0 0 120 102">
  <!-- open flaps behind the rim -->
  <path d="M8 16 l-6 -11 26 3 -4 8 z" fill="#a87848" stroke="#49270b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M112 16 l6 -11 -26 3 4 8 z" fill="#a87848" stroke="#49270b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- body -->
  <rect x="4" y="13" width="112" height="85" rx="6" fill="#c79a66" stroke="#49270b" stroke-width="3"/>
  <!-- rim shading -->
  <rect x="8" y="16" width="104" height="9" rx="4" fill="#a87848"/>
  <!-- horn emblem -->
  <path d="M60 34 l-8 24 q8 4 16 0 z" fill="#ffd166" stroke="#49270b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M57 46 l7 -3 M54 54 l9 -4" fill="none" stroke="#d9a83f" stroke-width="2" stroke-linecap="round"/>
  <!-- rainbow stripes -->
  <rect x="18" y="68" width="84" height="8" rx="4" fill="#f48fb1" stroke="#49270b" stroke-width="2"/>
  <rect x="18" y="81" width="84" height="8" rx="4" fill="#81d4fa" stroke="#49270b" stroke-width="2"/>
</svg>
</div>

</body>
</html>
