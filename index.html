<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Cut from her concept art by tools/cut_favicon.py: her head for the tab,
         all of her on the backyard sky for a tablet's home screen. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <title>Pusheen's Lazy Afternoon</title>

    <meta name="description" content="A tiny cozy fan game: a plump cat potters around a little house, wakes a sleepy sloth and naps in a sunbeam." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pusheen's Lazy Afternoon" />
    <meta property="og:description" content="A tiny cozy fan game. Unofficial fan project." />
    <meta property="og:url" content="https://pusheen-game.netlify.app/" />
    <meta property="og:image" content="https://pusheen-game.netlify.app/share.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
</head>

    <div id="app">
        <div id="game-container"></div>
    </div>
